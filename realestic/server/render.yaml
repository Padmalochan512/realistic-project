services:
  - type: web
    name: realistic-project-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn server.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "realistic-project.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://realistic-project.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.0"
